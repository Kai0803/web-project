# 以 podman play kube 啟動冷氣工程服務系統
#
#   podman build -t ac-service:latest .
#   podman kube play deploy/ac-service.yaml
#
# 正式環境請改掉下方 Secret 的 session-secret（見 README）。
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ac-service-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: ac-service-secret
type: Opaque
stringData:
  # 開發用預設值，正式環境請替換為隨機字串：openssl rand -base64 32
  session-secret: dev-only-change-me
---
apiVersion: v1
kind: Pod
metadata:
  name: ac-service
  labels:
    app: ac-service
spec:
  restartPolicy: Always
  containers:
    - name: app
      image: localhost/ac-service:latest
      imagePullPolicy: Never
      ports:
        - containerPort: 3000
          hostPort: 3000
      env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "3000"
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: ac-service-secret
              key: session-secret
      volumeMounts:
        - name: data
          mountPath: /app/data
      # 使用 exec probe 而非 httpGet：podman 會把 httpGet 轉成 curl 指令，
      # 但 node slim image 未內建 curl。改用 node 內建 http 模組即可免裝套件。
      readinessProbe:
        exec:
          command:
            - node
            - -e
            - "require('http').get('http://127.0.0.1:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        initialDelaySeconds: 3
        periodSeconds: 10
      livenessProbe:
        exec:
          command:
            - node
            - -e
            - "require('http').get('http://127.0.0.1:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        initialDelaySeconds: 10
        periodSeconds: 30
      resources:
        requests:
          memory: 128Mi
          cpu: 100m
        limits:
          memory: 512Mi
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: ac-service-data
