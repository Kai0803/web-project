<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 300" width="700" height="300">
  <rect width="700" height="300" fill="#F7F8F9"/>

  <defs>
    <!-- A：彎頭，銅色畫在管口 -->
    <g id="elbow">
      <path d="M 20 80 H 40 A 40 40 0 0 0 80 40 V 20"
            fill="none" stroke="#1F3A4D" stroke-width="19" stroke-linecap="butt"/>
      <path d="M 23 70.5 V 89.5" stroke="#B87333" stroke-width="6" stroke-linecap="butt"/>
      <path d="M 70.5 23 H 89.5" stroke="#B87333" stroke-width="6" stroke-linecap="butt"/>
    </g>
    <g id="elbow-mono">
      <path d="M 20 80 H 40 A 40 40 0 0 0 80 40 V 20"
            fill="none" stroke="#1F3A4D" stroke-width="19" stroke-linecap="butt"/>
      <path d="M 23 70.5 V 89.5" stroke="#F7F8F9" stroke-width="6" stroke-linecap="butt"/>
      <path d="M 70.5 23 H 89.5" stroke="#F7F8F9" stroke-width="6" stroke-linecap="butt"/>
    </g>

    <!-- B：迴路，開口式管路系統 -->
    <g id="loop">
      <path d="M 52 16 H 68 A 16 16 0 0 1 84 32 V 64 A 16 16 0 0 1 68 80 H 28 A 16 16 0 0 1 12 64 V 32 A 16 16 0 0 1 28 16 H 40"
            fill="none" stroke="#1F3A4D" stroke-width="13" stroke-linecap="butt"/>
      <path d="M 52 10.5 V 21.5" stroke="#B87333" stroke-width="5" stroke-linecap="butt"/>
      <path d="M 40 10.5 V 21.5" stroke="#B87333" stroke-width="5" stroke-linecap="butt"/>
    </g>

    <!-- C：管網 -->
    <g id="network">
      <path d="M 12 24 H 44 A 16 16 0 0 1 60 40 V 58 A 16 16 0 0 0 76 74 H 88"
            fill="none" stroke="#1F3A4D" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="24" r="7.5" fill="#B87333"/>
      <circle cx="88" cy="74" r="7.5" fill="#B87333"/>
    </g>
  </defs>

  <g transform="translate(50,40)">
    <text x="50" y="-12" font-family="Helvetica" font-size="13" fill="#6B7A85" text-anchor="middle">A 彎頭</text>
    <use href="#elbow"/>
  </g>
  <g transform="translate(250,40)">
    <text x="48" y="-12" font-family="Helvetica" font-size="13" fill="#6B7A85" text-anchor="middle">B 迴路</text>
    <use href="#loop"/>
  </g>
  <g transform="translate(450,40)">
    <text x="50" y="-12" font-family="Helvetica" font-size="13" fill="#6B7A85" text-anchor="middle">C 管網</text>
    <use href="#network"/>
  </g>

  <text x="50" y="186" font-family="Helvetica" font-size="12" fill="#6B7A85">24px：</text>
  <g transform="translate(108,166) scale(0.24)"><use href="#elbow"/></g>
  <g transform="translate(158,166) scale(0.24)"><use href="#loop"/></g>
  <g transform="translate(208,166) scale(0.24)"><use href="#network"/></g>

  <text x="50" y="250" font-family="Helvetica" font-size="12" fill="#6B7A85">單色：</text>
  <g transform="translate(105,212) scale(0.45)"><use href="#elbow-mono"/></g>
  <g transform="translate(190,212) scale(0.45)">
    <path d="M 52 16 H 68 A 16 16 0 0 1 84 32 V 64 A 16 16 0 0 1 68 80 H 28 A 16 16 0 0 1 12 64 V 32 A 16 16 0 0 1 28 16 H 40"
          fill="none" stroke="#1F3A4D" stroke-width="13" stroke-linecap="butt"/>
  </g>
  <g transform="translate(275,212) scale(0.45)">
    <path d="M 12 24 H 44 A 16 16 0 0 1 60 40 V 58 A 16 16 0 0 0 76 74 H 88"
          fill="none" stroke="#1F3A4D" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="24" r="7.5" fill="#1F3A4D"/>
    <circle cx="88" cy="74" r="7.5" fill="#1F3A4D"/>
  </g>

  <rect x="430" y="196" width="240" height="86" rx="6" fill="#1F3A4D"/>
  <text x="446" y="246" font-family="Helvetica" font-size="12" fill="#9FB0BC">反白：</text>
  <g transform="translate(500,212) scale(0.45)">
    <path d="M 20 80 H 40 A 40 40 0 0 0 80 40 V 20" fill="none" stroke="#FFFFFF" stroke-width="19" stroke-linecap="butt"/>
    <path d="M 23 70.5 V 89.5" stroke="#B87333" stroke-width="6" stroke-linecap="butt"/>
    <path d="M 70.5 23 H 89.5" stroke="#B87333" stroke-width="6" stroke-linecap="butt"/>
  </g>
  <g transform="translate(585,212) scale(0.45)">
    <path d="M 12 24 H 44 A 16 16 0 0 1 60 40 V 58 A 16 16 0 0 0 76 74 H 88" fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="12" cy="24" r="7.5" fill="#B87333"/>
    <circle cx="88" cy="74" r="7.5" fill="#B87333"/>
  </g>
</svg>
